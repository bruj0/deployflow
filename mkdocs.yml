site_name: DeployFlow
site_description: Application delivery to a target container, with a contract an agent can extend and checks that can refuse a plausible but broken deployment.
site_url: https://bruj0.github.io/deployflow
repo_url: https://github.com/bruj0/deployflow
repo_name: bruj0/deployflow
edit_uri: edit/main/site_src/

docs_dir: site_src
site_dir: site

theme:
  name: material
  logo: assets/logo-icon.png
  favicon: assets/logo-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# The diagram viewer is vendored, not a plugin and not a CDN. A plugin owns
# the markup it wraps, and a CDN makes the site's diagrams depend on a third
# party's uptime. The order below is load order and it matters: a script that
# runs before its library finds no global and returns early.
#
#   mermaid.min.js       defines window.mermaid, which Material checks for
#                        before it would fetch Mermaid from a CDN
#   mermaid-theme-patch  corrects the label colours inside the closed shadow
#                        root Material creates, which no stylesheet can reach
#   panzoom.min.js       @panzoom/panzoom, the library the viewer drives
#   diagram-zoom.js      the viewer itself
extra_javascript:
  - media/mermaid.min.js
  - media/mermaid-theme-patch.js
  - media/panzoom.min.js
  - media/diagram-zoom.js

extra_css:
  # The fixed light card around each diagram.
  - media/mermaid-card.css
  # The viewer's own styles.
  - media/diagram-zoom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid_fences.fence_pre_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Essay: index.md
  - The project:
      - Readme: project/readme.md
      - Agent guide: project/agents.md
      - Contributing: project/contributing.md
      - Security: project/security.md
      - Add-app skill: project/add-app-skill.md
      - Init skill: project/init-skill.md
  - Reference:
      - Index: reference/index.md
      - Overview: reference/overview.md
      - Architecture: reference/architecture.md
      - Targets: reference/targets.md
      - Configuration: reference/configuration.md
      - Build pipeline: reference/build-pipeline.md
      - Rendering: reference/rendering.md
      - Secrets: reference/secrets.md
      - Site: reference/site.md
  - Applications:
      - example-app: apps/example-app.md
      - omniroute-release: apps/omniroute-release.md
      - omniroute: apps/omniroute.md
      - builder: apps/builder.md
      - xerj: apps/xerj.md
      - homarr: apps/homarr.md
      - aurral: apps/aurral.md
      - Building OmniRoute from source: apps/omniroute-building-from-source.md
