name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest tests -q

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      # The real inventory is gitignored — it names the operator's own hosts —
      # so the syntax check runs against the committed template instead. It
      # exercises the same playbook, the same role paths and the same
      # group_vars layout, which is what this job is for.
      - run: ansible-playbook --syntax-check -i inventory.example/hosts.yml playbooks/site.yml
