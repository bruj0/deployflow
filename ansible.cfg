[defaults]
inventory = inventory/hosts.yml
# Two role roots, colon-separated. `common` holds everything that does not
# know what application it is provisioning; `apps` holds one directory per
# application. Splitting them is what lets a new application be added without
# reading or editing any framework code.
roles_path = common:apps
# `accept-new` is trust-on-first-use: a new key is recorded, a changed key is
# refused. `True` would prompt instead, and under a non-interactive runner that
# surfaces as "ssh_askpass: exec(): No such file or directory", which reads like
# a broken SSH install rather than a deliberate security choice.
host_key_checking = accept-new
retry_files_enabled = False
result_format = yaml
interpreter_python = auto_silent
# Guests take a DHCP lease rather than a fixed address, so the address is only
# known once Proxmox has answered. A longer connect timeout absorbs the lookup
# and the first-boot delay on a freshly created container.
timeout = 60

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
# Connection multiplexing is OFF, and this is not a performance tweak.
#
# Measured with four guests installing simultaneously (run.py --fleet 4): all
# four failed with
#   UNREACHABLE! "Data could not be sent to remote host 10.0.0.75"
# during the pinned install. ControlMaster reuses one SSH connection per host
# for several tasks; a pip install holds that connection open for minutes
# while transferring hundreds of megabytes, and the multiplexed channel
# breaks under that load. The play then reports the host as unreachable,
# which looks like a network fault and is not one.
#
# Without multiplexing each task opens its own connection. That is slower per
# task and much faster overall, because nothing has to retry.
ssh_args = -o PreferredAuthentications=publickey -o ServerAliveInterval=30 -o ServerAliveCountMax=6