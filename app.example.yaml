# Configuration for appctl. Copy this to app.yaml and edit it.
#
# Unknown keys are rejected rather than ignored, so a typo fails loudly here
# instead of silently changing nothing.
version: 1

defaults:
  # The interpreter the guest's venv is built from. Must match the Python the
  # lockfile was compiled for, or pip installs wheels for the wrong ABI.
  python_version: "3.14"
  # Stock Proxmox template. Pinned by exact filename: bumping it changes the
  # apt candidate set in one step.
  template: ubuntu-26.04-standard_26.04-1_amd64.tar.zst
  storage: local
  rootfs_gb: 16
  cores: 2
  memory_mb: 2048
  swap_mb: 512
  features: nesting=1,fuse=1,keyctl=1
  onboot: 0

applications:

  # The sample application from the quickstart.
  #
  # It is published on PyPI, so nothing is built: the wheel already exists.
  example-app:
    description: the quickstart sample
    target:
      kind: proxmox_lxc        # the only implemented target
      options:
        hostname: example-app
        vmid: 121               # optional; omit to let the role skip create
        bind_host: 127.0.0.1    # 0.0.0.0 exposes the service to the network
    source:
      kind: package
      # The package the role installs to serve the application. The
      # application's own name is not the package name: `example-app` is what
      # the guest calls the service, `bottle` is what gets installed. The role
      # checks the two agree.
      package: "bottle==0.13.3"
    config:
      target: "{{ app_state_dir }}/config.json"
      files:
        - apps/example-app/config.yml
      mode: "0640"
      vars:
        app_port: 8080
    secrets: []                 # names of keys required in .env

  # An application installed from a published release — an npm package, a
  # tarball, anything the guest itself can fetch.
  #
  # `kind: package` means "nothing is built here": the artifact already exists,
  # and the application's own role does the installing on the guest. The
  # `package` value is the version pin, and it is the string the role reads.
  #
  # The key and the role directory have to match: `appctl install` selects the
  # role with `--tags lxc,<key>`, and a key that is not a role name selects
  # nothing. The key does NOT have to match the role's `app_name` — that is
  # what the guest sees, and it is what derives the service account, the
  # install root and the state directory. `apps/omniroute-release/` is a
  # worked example of the two differing on purpose.
  #
  # omniroute-release:
  #   description: OmniRoute from a published npm release
  #   target:
  #     kind: proxmox_lxc
  #     options:
  #       hostname: omniroute
  #       vmid: 120
  #       bind_host: 0.0.0.0       # published on the LAN; secrets are required
  #   source:
  #     kind: package
  #     package: "omniroute-release@3.8.51"
  #   secrets:
  #     - omniroute_jwt_secret
  #     - omniroute_api_key_secret
  #     - omniroute_storage_encryption_key
  #     - omniroute_initial_password
  #     - omniroute_ws_bridge_secret
