---
# Create the guest with `pct`.
#
# There is no Ansible module for this. community.proxmox 2.1.0 ships 45 modules
# and none of them manages a container: `proxmox_kvm` is VM-only, and
# `proxmox_template` downloads a vztmpl but never runs `pct create`. The
# `proxmox_pct_remote` connection plugin is not a substitute — it drives tasks in
# a container that already exists and it needs paramiko, which cannot use the
# Bitwarden agent socket this account authenticates with.
#
# So `pct` runs here as a command delegated to the Proxmox host. The cost is
# real and worth stating: no module means no diff, no change reporting and no
# rollback. Creation is guarded by a stat so a second run is a no-op.

- name: Put the operator public key on the Proxmox host
  # `pct create --ssh-public-keys` takes a FILE PATH, not inline text. Passing
  # the key directly fails with "can't open 'ssh-ed25519 AAAA...' - No such file
  # or directory", which reads like a quoting problem rather than a wrong
  # argument type.
  ansible.builtin.copy:
    content: "{{ lxc_ssh_public_key }}\n"
    dest: "{{ lxc_pubkey_path_on_proxmox }}"
    mode: "0600"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root

- name: Check whether the container already exists
  # `creates` cannot be combined with `argv`, so the guard is an explicit stat.
  # This also reports better: an existing container is visibly skipped rather
  # than silently reported as unchanged.
  ansible.builtin.stat:
    path: "/etc/pve/lxc/{{ lxc_vmid }}.conf"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root
  register: lxc_existing

- name: Create the container from the stock template
  # ip=dhcp, with no address and no gateway given.
  #
  # This was measured, not assumed. A statically addressed Ubuntu 26.04 guest
  # comes up with no IPv4 on eth0, an empty /etc/netplan/, and systemd-networkd
  # exiting 243/CREDENTIALS because it carries
  # ImportCredential=network.wireguard.* with nothing to match. Handing the
  # address to Proxmox instead avoids the whole fault: networkd starts clean,
  # /etc/netplan/ stays empty, and networking works. Verified across a
  # `pct reboot` — the lease and the route both come back.
  #
  # Proxmox also writes /etc/resolv.conf in the guest and registers the
  # hostname in its own resolver, so the guest needs no DNS configuration at all.
  ansible.builtin.command:
    argv:
      - /usr/sbin/pct
      - create
      - "{{ lxc_vmid }}"
      - "local:vztmpl/{{ lxc_template }}"
      - "--hostname={{ lxc_hostname }}"
      - "--arch=amd64"
      - "--cores={{ lxc_cores }}"
      - "--memory={{ lxc_memory }}"
      - "--swap={{ lxc_swap }}"
      - "--rootfs={{ lxc_storage }}:{{ lxc_rootfs_gb }}"
      - "--net0=name={{ lxc_net_name }},bridge={{ lxc_bridge }},ip=dhcp,type=veth"
      - "--unprivileged={{ lxc_unprivileged }}"
      - "--features={{ lxc_features }}"
      - "--onboot={{ lxc_onboot }}"
      - "--start=0"
      - "--ssh-public-keys={{ lxc_pubkey_path_on_proxmox }}"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root
  # `pct create` is not re-entrant, so the guard has to sit in front of it.
  when: not lxc_existing.stat.exists

- name: Resolve this guest's shared disk attachments
  # The guest's `group_vars` names the disks it attaches; the manifest holds
  # the facts about each one. The join happens here, per guest, so a guest
  # attaches its own mounts and not everybody's.
  #
  # The list is built by a loop, one entry per attachment, rather than by a
  # comprehension: Jinja has no inline dict comprehension, and
  # `[{'a': x['b']} for x in items]` is a parse error rather than a wrong
  # answer. Measured:
  #
  #   template error while templating string: expected token ',', got 'for'
  ansible.builtin.set_fact:
    lxc_shared_mounts: >-
      {{ lxc_shared_mounts | default([]) + [ {
           'disk': shared_disks[item.disk],
           'mount': {'mountpoint': item.mountpoint,
                     'read_only': item.read_only | default(false)}} ] }}
  changed_when: false
  loop: "{{ shared_disk_mounts | default([]) }}"
  loop_control:
    label: "{{ item.disk }}"

- name: Refuse to attach a disk this guest names but the manifest does not
  # A typo in the disk name would otherwise attach nothing and report
  # success. The check is here because this is where the guest's list and the
  # manifest's list meet.
  ansible.builtin.assert:
    that:
      - item.disk in (shared_disks | default({}))
    fail_msg: >-
      this guest attaches the shared disk {{ item.disk }}, which the manifest
      does not declare.
    quiet: true
  loop: "{{ shared_disk_mounts | default([]) }}"
  loop_control:
    label: "{{ item.disk }}"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root

- name: Read the container's current mount points
  # The attach task has to be idempotent: a second install must report
  # `changed=0`, or the role reinstalls itself on every play. `pct set -mpN`
  # always reports a change, so the current configuration is read first and
  # the attach is skipped when it already says what is wanted.
  #
  # The comparison is on the mount point's own line, not on the whole
  # configuration. `pct config` writes:
  #
  #   mp0: data2:vm-900-disk-0,mp=/mnt/volume,idmap=u:1000:101000:1;g:1000:101000:1
  #   mp1: data2:vm-900-disk-0,mp=/mnt/other,idmap=u:1000:101000:1;g:1000:101000:1,ro=1
  #
  # so a search for the volume alone would match the wrong line.
  ansible.builtin.command:
    argv:
      - /usr/sbin/pct
      - config
      - "{{ lxc_vmid }}"
  register: lxc_current_config
  changed_when: false
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root

- name: Read the mount point line each attachment would write
  # One line per attachment, holding what the container currently has at
  # that index. A mount point that is not configured yet reads as an empty
  # string, which never matches what the attachment wants.
  ansible.builtin.set_fact:
    lxc_mount_lines: >-
      {{ lxc_mount_lines | default([]) + [ {
           'index': lxc_shared_mount_index,
           'line': (lxc_current_config.stdout.splitlines()
                    | select('match', '^mp' ~ lxc_shared_mount_index ~ ':')
                    | first | default('')) } ] }}
  changed_when: false
  loop: "{{ lxc_shared_mounts | default([]) }}"
  loop_control:
    index_var: lxc_shared_mount_index
    label: "{{ item.disk.volume }} -> {{ item.mount.mountpoint }}"

- name: Record what each attachment would write
  # The line the attach task writes, so the comparison below is against one
  # string rather than an expression repeated twice.
  #
  # Proxmox adds `size=` to the line it stores, so the stored line is longer
  # than what is written:
  #
  #   written: mp0: data2:vm-900-disk-0,mp=/mnt/volume,idmap=u:1000:101000:1;g:1000:101000:1
  #   stored:  mp0: data2:vm-900-disk-0,mp=/mnt/volume,idmap=u:1000:101000:1;g:1000:101000:1,size=1000G
  #
  # The stored line therefore starts with what is written, and that prefix is
  # what the comparison uses.
  ansible.builtin.set_fact:
    lxc_mount_wanted: >-
      {{ lxc_mount_wanted | default([]) + [ {
           'index': lxc_shared_mount_index,
           'wanted': ('mp' ~ lxc_shared_mount_index ~ ': '
                      ~ item.disk.storage ~ ':' ~ item.disk.volume
                      ~ ',mp=' ~ item.mount.mountpoint
                      ~ ',idmap=' ~ item.disk.idmap
                      ~ (',ro=1' if item.mount.read_only else '')) } ] }}
  changed_when: false
  loop: "{{ lxc_shared_mounts | default([]) }}"
  loop_control:
    index_var: lxc_shared_mount_index
    label: "{{ item.disk.volume }} -> {{ item.mount.mountpoint }}"

- name: Attach each shared disk to the container
  # A shared volume is attached with `pct set -mpN`. The volume is named
  # `<storage>:<volume>` and the idmap is the disk's own, the same one every
  # guest that attaches the disk uses.
  #
  # The idmap has to be identical on every guest: btrfs stores one idmap per
  # filesystem in its superblock, so a second guest asking for a different one
  # is refused and the container refuses to start. Measured:
  #
  #   mp0: ...,idmap=u:107:101000:1;g:110:101000:1
  #   -> startup for container '211' failed
  #
  # It also has to be one-to-one. A wide idmap overlaps the guest's own
  # `lxc.idmap` (`u 0 100000 65536`), and the shared tree then appears as
  # `nobody` and the writer cannot write to it.
  #
  # The mount point names where the filesystem is attached. It does not select
  # a directory of it: the guest sees the filesystem root there. Selecting a
  # subtree is the application's own business.
  #
  # The task runs before the container starts, because Proxmox attaches the
  # volume when it starts the guest, and a guest that starts without its
  # shared disk is a guest serving an empty library.
  ansible.builtin.command:
    argv:
      - /usr/sbin/pct
      - set
      - "{{ lxc_vmid }}"
      - "-mp{{ lxc_shared_mount_index }}"
      - "{{ item.disk.storage }}:{{ item.disk.volume }},mp={{ item.mount.mountpoint }},idmap={{ item.disk.idmap }}{{ ',ro=1' if item.mount.read_only else '' }}"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root
  loop: "{{ lxc_shared_mounts | default([]) }}"
  loop_control:
    index_var: lxc_shared_mount_index
    label: "{{ item.disk.volume }} -> {{ item.mount.mountpoint }}"
  when: >-
    not lxc_mount_lines[lxc_shared_mount_index].line
    .startswith(lxc_mount_wanted[lxc_shared_mount_index].wanted)

- name: Start the container
  ansible.builtin.command:
    argv:
      - /usr/sbin/pct
      - start
      - "{{ lxc_vmid }}"
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root
  register: lxc_start
  changed_when: "'already running' not in lxc_start.stderr"
  failed_when: false

- name: Ask Proxmox which address the guest was leased
  # The address is not in this repository, so it has to be discovered. Read from
  # inside the container with `hostname -I` rather than by DNS: the guest itself
  # is the authoritative answer, and it works whether the lease came from DHCP
  # or a fixed address.
  #
  # `--` is required. `pct exec` parses the guest's own flags as its own, so
  # without it `hostname -I` arrives as "Unknown option: i" and pct exits 400.
  # Everything after `--` is passed to the command untouched.
  ansible.builtin.command:
    argv:
      - /usr/sbin/pct
      - exec
      - "{{ lxc_vmid }}"
      - --
      - hostname
      - -I
  delegate_to: "{{ groups['proxmox'][0] }}"
  become: true
  become_user: root
  register: lxc_guest_addr
  changed_when: false
  # `pct exec` fails while the container is still booting. Retry rather than
  # failing the play on a race that resolves itself in seconds.
  until: lxc_guest_addr.rc == 0 and lxc_guest_addr.stdout | length > 0
  retries: 30
  delay: 5

- name: Record the leased address as the host's ansible_host
  # Everything downstream — play 2, the SSH connection, the health assertions —
  # reads ansible_host. Overwriting it here is what lets the inventory omit an
  # address entirely.
  #
  # `hostname -I` can list several addresses. The first one on a single-interface
  # guest is the vnet address; the rest come from container-internal interfaces
  # such as lo's IPv6.
  ansible.builtin.set_fact:
    ansible_host: "{{ lxc_guest_addr.stdout.split()[0] }}"

- name: Show the address the guest was leased
  ansible.builtin.debug:
    msg: "{{ lxc_hostname }} is at {{ ansible_host }} (from DHCP)"

- name: Wait for the guest to accept SSH
  # Creation returns before sshd is listening. Without this wait the next play
  # fails with a connection reset that looks like a key problem.
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    timeout: "{{ lxc_ssh_timeout }}"
    state: started
  delegate_to: "{{ groups['proxmox'][0] }}"

- name: Forget any stale host key for this guest's address
  # Only ever runs when the container was created by this task.
  #
  # A DHCP lease means the address an earlier guest held now belongs to a
  # different container, with a different SSH host key. `accept-new` records an
  # unseen key but REFUSES a changed one, which is the right default and the
  # right behaviour for a real machine. Here it would stop the play with:
  #   REMOTE HOST IDENTIFICATION HAS CHANGED
  #   Offending ECDSA key in ~/.ssh/known_hosts:51
  # every time a guest is rebuilt at the same address.
  #
  # `ssh-keygen -R` and not a line edit, because a hashed known_hosts entry
  # does not carry the host name in plaintext. This file's entries are
  # hashed — 27 of them at the time of writing — so a regexp over the file
  # matches nothing and the stale key survives the task. `ssh-keygen -R`
  # removes the entry whether it is hashed or not, which is the only thing
  # that works here.
  #
  # Scoped to this guest's own address on purpose. A known_hosts entry for any
  # other host is never touched, so the refusal still protects every machine
  # that is not a guest of this repository.
  #
  # Runs against the controller, on localhost, because the keys that matter are
  # in the operator's own known_hosts and not on the Proxmox node.
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ ansible_host }}"
      - -f
      - "{{ ansible_env.HOME }}/.ssh/known_hosts"
  register: lxc_known_hosts_removed
  changed_when: >-
    lxc_known_hosts_removed.rc == 0
    and 'not found' not in (lxc_known_hosts_removed.stderr | default(''))
  failed_when: false
  delegate_to: localhost
  become: false
  when:
    - not lxc_existing.stat.exists
    - ansible_env.HOME is defined

- name: Wait for the guest to accept SSH again with the fresh key
  # The previous connection was refused on the key, so the wait is repeated to
  # confirm the new one is accepted before the next play connects.
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    timeout: "{{ lxc_ssh_timeout }}"
    state: started
  delegate_to: localhost
  become: false
  when:
    - not lxc_existing.stat.exists
    - ansible_env.HOME is defined
