---
# Install one application into a guest and prove that it works.
#
# The checks at the end are the point of this role. A play that ends green
# proves that Ansible ran, not that the application is usable. Each check below
# stands in for a failure that a green play would otherwise hide:
#
#   the venv exists          the package tree was never installed
#   the module imports        the dependency tree is absent or broken
#   the unit is active        systemd accepted the unit but the service died
#   the port is listening     the process is up but bound somewhere else
#   the endpoint answers      the service listens but does not serve
#
# The last one is the only check that reaches the application the way a user
# does. A service that binds a port and returns nothing is still broken.

- name: Refuse to install without an application name and port
  # app_name and app_port have no defaults on purpose: an undefined variable
  # deep inside a templated path is harder to read than one clear message.
  ansible.builtin.assert:
    that:
      - app_name is defined
      - app_name | length > 0
      - app_port is defined
    fail_msg: >-
      app_name and app_port must be set in apps/{{ role_path | default('unknown') }}/defaults/main.yml.
    quiet: true
    success_msg: "installing {{ app_name }}"

- name: Refuse to install a package the manifest does not name
  # The manifest says where the application comes from and the role says what
  # it installs. Those are two files, and they can drift. This refuses the run
  # when they disagree, because a mismatch here means the role would install
  # something other than what the manifest asked for — and the manifest is what
  # the operator reviewed.
  #
  # The application's own name is not the package name. `example-app` is what
  # the guest calls the service; `bottle` is what gets installed to serve it.
  ansible.builtin.assert:
    that:
      - appctl_source_package is defined
      - appctl_source_version is defined
      - appctl_source_package == app_package_name
      - appctl_source_version == app_package_version
    fail_msg: >-
      The manifest pins {{ appctl_source_package | default('nothing')
      }}=={{ appctl_source_version | default('nothing') }}, but this role
      installs {{ app_package_name }}=={{ app_package_version }}. Change one of
      them, or change this check if the role is meant to install a different
      package than the manifest names.
    quiet: true

- name: Copy the lockfile to the guest
  # The lockfile is read by PIP, ON THE GUEST, and pip on the guest cannot open
  # a path on the controller. Pointing pip at the controller's path fails with
  # "Could not open requirements file" — which names a missing file rather
  # than a file that is present, on a different machine.
  #
  # So the file travels first, and pip is pointed at where it landed.
  #
  # It is copied rather than templated because it is a plain requirements file:
  # the hashes are the content, and there is nothing to substitute.
  ansible.builtin.copy:
    src: "{{ role_path }}/files/requirements.lock"
    dest: "{{ app_dir }}/requirements.lock"
    owner: root
    group: root
    mode: "0644"

- name: Install the application
  # The lockfile is pinned by sha256, so the tree that installs is the tree
  # that was reviewed. `--require-hashes` is what enforces it at install time;
  # the build refuses a lockfile without hashes, so the two agree.
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.lock"
    virtualenv: "{{ app_venv }}"
    extra_args: "--require-hashes"
  register: app_install
  failed_when: false

- name: Fail when the install did not complete
  ansible.builtin.fail:
    msg: >-
      The application could not be installed from {{ app_dir }}/requirements.lock.
      The install failed with: {{ app_install.msg | default('no message') }}
  when: app_install is failed

- name: Install the application module
  # The module the server imports. It sits in the install root, next to the
  # venv, and the unit's PYTHONPATH points at that root.
  #
  # It is a real file rather than a template because there is nothing to
  # substitute: the paths it needs are the ones the framework already defines.
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ app_module }}.py"
    dest: "{{ app_dir }}/{{ app_module }}.py"
    owner: root
    group: root
    mode: "0644"

- name: Check that the application can be imported
  # A package in site-packages is not a working package. This catches a
  # dependency tree that did not install and a native extension that did not
  # compile.
  #
  # The module name is `app_module`, not `app_name`. The application's name
  # contains a hyphen and is not a valid Python identifier, so
  # `import example-app` is a syntax error rather than a missing module — and
  # the check would fail for a reason that has nothing to do with the install.
  #
  # It runs with the install root as the working directory, because that is
  # where the module was just placed and where the unit will look for it.
  ansible.builtin.command:
    argv:
      - "{{ app_venv }}/bin/python"
      - -c
      - "import {{ app_module }}"
    chdir: "{{ app_dir }}"
  changed_when: false
  register: app_import
  failed_when: false

- name: Fail when the application cannot be imported
  ansible.builtin.fail:
    msg: >-
      {{ app_name }} is installed but cannot be imported: {{ app_import.stderr | default('no error output') }}
  when: app_import.rc != 0

- name: Write the systemd unit
  ansible.builtin.template:
    src: "{{ app_name }}.service.j2"
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    mode: "0644"
  notify: Restart {{ app_service_name }}

- name: Enable and start the service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the service to accept connections
  # systemd reports the unit as active long before the process binds a port.
  # Without this wait the check below fails against a service that simply has
  # not finished starting.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    timeout: 60
    state: started

- name: Check that the service is listening on the requested port
  # `systemctl is-active` says the process is up. It does not say the process
  # bound the port the operator asked for. A service that came up on 8000
  # instead of 8080 passes an is-active check and fails every user request.
  ansible.builtin.command:
    argv:
      - ss
      - -ltn
  changed_when: false
  register: app_listeners
  failed_when: false

- name: Fail when the service is not listening on the requested port
  ansible.builtin.fail:
    msg: >-
      The service is running but is not listening on port {{ app_port }}.
      Listening sockets: {{ app_listeners.stdout_lines | default([]) | join(', ') }}
  when: app_port | string not in app_listeners.stdout

- name: Check that the application answers a request
  # The only check that reaches the application the way a user does. A service
  # that binds a port and returns nothing is still broken, and no amount of
  # process inspection finds that out.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path | default('/') }}"
    status_code: [200, 201, 204, 301, 302, 401, 403]
    timeout: 15
  register: app_endpoint
  failed_when: false
  retries: 3
  delay: 5
  until: app_endpoint.status is defined

- name: Fail when the application does not answer
  ansible.builtin.fail:
    msg: >-
      The service listens on port {{ app_port }} but does not answer a request
      to {{ app_health_path | default('/') }}. Status: {{ app_endpoint.status | default('no response') }}.
      Check: journalctl -u {{ app_service_name }}
  when: app_endpoint.status is undefined

- name: Report the checks that passed
  ansible.builtin.debug:
    msg:
      - "{{ app_name }} is installed and answering on port {{ app_port }}"
      - "import {{ app_module }}: ok"
      - "unit {{ app_service_name }}: active"
      - "listener on {{ app_port }}: present"
      - "endpoint {{ app_health_path | default('/') }}: HTTP {{ app_endpoint.status }}"
