---
# Declare the dependency, not the playbook.
#
# Ansible runs a role's dependencies before its own tasks, so common/python
# creates the service account, the install root and the state directory first.
# This is what lets a new application avoid editing any playbook.
#
# Homarr uses none of the Python that dependency installs; the venv sits inert
# beside the Compose project, and the same is true of proxcenter, xerj and
# omniroute-release. The alternative — defining the account and the paths in
# this role — is not available to an application that installs a service:
# common/python also asserts that app_port is defined, and duplicating the
# account creation would be worse than one unused venv.
dependencies:
  - role: python
