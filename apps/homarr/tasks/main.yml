---
# Homarr, the dashboard, as one container.
#
# This role installs a container engine, one pinned image and a Compose project
# it writes itself. It builds nothing and fetches no artifact from a branch: the
# image is pinned by digest and the Compose file is a template in this role.
#
# Everything the application writes lives under app_state_dir, which
# common/python creates once and neither role touches again. Redeploying
# therefore never discards the SQLite database and never invalidates the
# SECRET_ENCRYPTION_KEY that encrypts every stored integration credential.
#
# This role assumes common/python has already run for the same application.

# ---------------------------------------------------------------------------
# The pin
# ---------------------------------------------------------------------------

- name: Refuse to install a release the manifest does not name
  # The manifest says where the application comes from and the role says what it
  # installs. Those are two files, and they can drift — which is exactly how
  # omniroute-release ended up pinned to 3.8.51 while the manifest named 3.8.53.
  #
  # `appctl` passes the manifest's pin in as appctl_source_* so this cannot pass
  # silently. `package` is a stretch for a container image, deliberately: it is
  # the schema's word for "a released artifact pinned by version", and the `==`
  # form is what makes appctl split it and pass the version through.
  ansible.builtin.assert:
    that:
      - appctl_source_package is defined
      - appctl_source_version is defined
      - appctl_source_package == 'homarr'
      - appctl_source_version == homarr_version
    fail_msg: >-
      The manifest pins {{ appctl_source_package | default('nothing')
      }}=={{ appctl_source_version | default('nothing') }}, but this role
      installs homarr=={{ homarr_version }}. Change one of them.
    quiet: true

# ---------------------------------------------------------------------------
# The guest can host the container
# ---------------------------------------------------------------------------
#
# Asserted before anything is installed. A guest that is too small does not fail
# at install — it fails later, when the container is OOM-killed, with a message
# that names a process rather than the guest.

- name: Read the guest's memory and core count
  ansible.builtin.set_fact:
    homarr_guest_memory_mb: "{{ ansible_memtotal_mb | int }}"
    homarr_guest_cores: "{{ ansible_processor_vcpus | int }}"

- name: Refuse a guest that cannot host the container
  ansible.builtin.assert:
    that:
      - homarr_guest_memory_mb | int >= homarr_min_memory_mb | int
      - homarr_guest_cores | int >= homarr_min_cores | int
    fail_msg: >-
      This guest has {{ homarr_guest_memory_mb }} MB and
      {{ homarr_guest_cores }} cores; Homarr needs at least
      {{ homarr_min_memory_mb }} MB and {{ homarr_min_cores }} cores.
      Raise lxc_memory / lxc_cores in inventory/group_vars/{{ group_names | first }}/main.yml
      and re-run.
    quiet: true

- name: Read the free space on the root filesystem
  # `-BG` prints a unit suffix, so the value is stripped before it is compared.
  # `df --output` also prints a header row above the value, which is why the
  # value is stdout_lines[1] and not the whole of stdout.
  ansible.builtin.command:
    argv: [df, --output=avail, -BG, /]
  changed_when: false
  register: homarr_df

- name: Refuse a guest with no room for the image and the database
  ansible.builtin.assert:
    that:
      - (homarr_df.stdout_lines[1] | trim | regex_replace('G$', '') | int) >= homarr_min_free_gb | int
    fail_msg: >-
      / has {{ homarr_df.stdout_lines[1] | trim }} free; Homarr needs at least
      {{ homarr_min_free_gb }} GB for the image layers and the database.
      Raise lxc_rootfs_gb and re-run.
    quiet: true

# ---------------------------------------------------------------------------
# The engine
# ---------------------------------------------------------------------------
#
# Docker CE from Docker's own apt repository. The role installs; it does not
# uninstall. A guest that already has a container runtime keeps it.

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's apt signing key
  ansible.builtin.get_url:
    url: "{{ homarr_docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Read the guest's distribution codename
  # The repo path carries the codename, and Ubuntu 26.04 is `resolute`. Reading
  # it rather than hard-coding it is what lets the same role run on a guest
  # built from a different template.
  ansible.builtin.command:
    argv: [lsb_release, -cs]
  changed_when: false
  register: homarr_codename

- name: Add Docker's apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] {{ homarr_docker_apt_repo }} {{ homarr_codename.stdout | trim }} stable
    owner: root
    group: root
    mode: "0644"
  register: homarr_docker_repo

- name: Install the Docker engine
  ansible.builtin.apt:
    name: "{{ homarr_docker_packages }}"
    state: present
    update_cache: true
  register: homarr_docker_install

- name: Start the engine and make it survive a reboot
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Read the engine's own version
  ansible.builtin.command:
    argv: [docker, --version]
  changed_when: false
  register: homarr_docker_version

# ---------------------------------------------------------------------------
# The Compose project
# ---------------------------------------------------------------------------

- name: Create the project directory
  ansible.builtin.file:
    path: "{{ homarr_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the Compose project
  ansible.builtin.template:
    src: homarr-compose.j2
    dest: "{{ homarr_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: homarr_compose_written

# ---------------------------------------------------------------------------
# The encryption key
# ---------------------------------------------------------------------------
#
# Generated here, once, and kept. Homarr encrypts every stored integration
# credential with it, so a regenerated key does not fail the install — it makes
# every saved secret undecryptable, silently. The role therefore reads the
# existing file first and reuses whatever it finds.
#
# The key must be 64 HEX characters. Homarr validates it at startup and exits
# with "SECRET_ENCRYPTION_KEY is required, please generate a 64 character
# secret in hex format" otherwise, so the generator below produces hex and
# appctl's own base64 generator would not do.

- name: Read the existing stack environment
  ansible.builtin.slurp:
    src: "{{ homarr_env_file }}"
  register: homarr_env_existing
  failed_when: false
  changed_when: false

- name: Work out which generated credentials already exist
  # Parsed here rather than with a lookup, so the values never enter the play's
  # variable space as a whole file and the ones that are kept are named.
  #
  # `regex_findall` returns a list of TUPLES, and `dict()` accepts them directly
  # — unlike `items2dict`, which requires a list of dicts and fails with
  # "items2dict requires a list of dictionaries, got [('KEY', '…'), …]".
  ansible.builtin.set_fact:
    homarr_existing_env: >-
      {{ dict((homarr_env_existing.content | default('') | b64decode)
              | regex_findall('^([A-Z_]+)=(.*)$', multiline=True)) }}

- name: Generate the encryption key when it does not exist yet
  # `chars=0123456789abcdef`, not `chars=hexdigits`. Both produce 64 characters
  # and Homarr accepts both, but the documented form is lowercase hex and
  # `openssl rand -hex 32` — the command Homarr's own docs give — produces
  # lowercase. Generating the documented form means a key copied out of this
  # file matches what an operator would produce by hand.
  ansible.builtin.set_fact:
    homarr_secret_encryption_key: >-
      {{ homarr_existing_env.SECRET_ENCRYPTION_KEY
         | default(lookup('password', '/dev/null length=64 chars=0123456789abcdef'), true) }}

- name: Write the stack environment
  # Mode 0600 and root-owned. It holds the encryption key, and the container
  # reads it through Compose's own env_file handling rather than through a
  # process environment, so no value reaches argv.
  ansible.builtin.template:
    src: homarr.env.j2
    dest: "{{ homarr_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: homarr_env_written

# ---------------------------------------------------------------------------
# The data directory
# ---------------------------------------------------------------------------
#
# /appdata holds the SQLite database, the Redis dump and the trusted
# certificates. The image's entrypoint runs as root by default (PUID=0) and
# creates the subdirectories itself, so root ownership is correct here — a
# non-root owner would make the entrypoint's own mkdir fail.

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ homarr_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# ---------------------------------------------------------------------------
# The image
# ---------------------------------------------------------------------------

- name: Pull the image by digest
  # By digest, not by tag. `--pull never` on the compose invocation below is
  # what stops a later `up` from fetching the tag the compose file names.
  ansible.builtin.command:
    argv: [docker, pull, "{{ homarr_image }}"]
  register: homarr_image_pull
  changed_when: "'Downloaded newer image' in homarr_image_pull.stdout"

- name: Read the digests the guest holds for the image
  # RepoDigests, NOT .Id. The pinned digest is an OCI INDEX digest — one entry
  # covering amd64 and arm64 — and `docker pull` resolves it to the manifest for
  # this platform. `.Id` is therefore the platform manifest's digest, which is a
  # different string from the one this role pins, and comparing the two fails on
  # a perfectly correct pull. RepoDigests records the index digest that was
  # actually requested, which is the thing that was reviewed.
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, "{{ '{{' }} json .RepoDigests {{ '}}' }}", "{{ homarr_image }}"]
  changed_when: false
  register: homarr_image_digests

- name: Fail when the image on the guest is not the pinned digest
  ansible.builtin.assert:
    that:
      - homarr_image in (homarr_image_digests.stdout | from_json)
    fail_msg: >-
      The guest holds {{ homarr_image_digests.stdout | default('nothing') | trim }},
      which does not include the pinned {{ homarr_image }}. The registry served
      a different build than the one that was reviewed.
    quiet: true

# ---------------------------------------------------------------------------
# The service
# ---------------------------------------------------------------------------

- name: Install the systemd unit
  ansible.builtin.template:
    src: homarr.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: homarr_unit

- name: Reload systemd when the unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: homarr_unit.changed | default(false)

- name: Start the container and make it survive a reboot
  # Restarted rather than started only when something it is serving actually
  # changed. Both templates are byte-identical on a settled play, which is what
  # keeps the steady state at changed=0 instead of bouncing the container every
  # run.
  #
  # The image pull is in that set: a digest that moved means the running
  # container is serving the old build, and the symptom of not restarting is a
  # board that reports the new version while running the old code.
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    enabled: true
    state: >-
      {{ 'restarted'
         if (homarr_env_written.changed | default(false)
             or homarr_compose_written.changed | default(false)
             or homarr_unit.changed | default(false)
             or homarr_image_pull.changed | default(false))
         else 'started' }}
    daemon_reload: true

# ---------------------------------------------------------------------------
# Postconditions
# ---------------------------------------------------------------------------
#
# A green play that does not prove the container works is the failure this
# repository exists to prevent. Every assertion below is the application's own
# answer about itself, not a count of tasks.

- name: Read the container the stack is running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ homarr_compose_file }}"
      - ps
      - --format
      - "{{ '{{' }} .Service {{ '}}' }}:{{ '{{' }} .State {{ '}}' }}"
  args:
    chdir: "{{ homarr_project_dir }}"
  changed_when: false
  register: homarr_ps

- name: Fail when the container is not running
  ansible.builtin.fail:
    msg: >-
      The container is not running:
      {{ homarr_ps.stdout | default('') | trim | default('no output', true) }}.
      Read its output with
      `docker compose -f {{ homarr_compose_file }} logs` on the guest.
  when: homarr_ps.stdout is not search('homarr:running')

- name: Wait for Homarr to report itself healthy
  # /api/health/live is the image's own HEALTHCHECK path. It answers 200 when
  # the database and the internal Redis both respond and 500 when either does
  # not, so a 200 here is the application's own statement that it can serve a
  # board — not merely that a process is listening.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/api/health/live"
    method: GET
    status_code: 200
  register: homarr_health
  until: homarr_health.status | default(0) == 200
  retries: "{{ (homarr_health_timeout | int / 10) | int }}"
  delay: 10
  changed_when: false

- name: Read the address the guest is reachable on
  ansible.builtin.shell:
    cmd: "ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | head -1"
  changed_when: false
  failed_when: false
  register: homarr_guest_address

- name: Work out whether the controller can reach this guest
  # The controller can only assert what a network peer can reach, which a
  # loopback bind denies by design. Everything below is gated on this, so a
  # lockdown is reported as a lockdown and not as a broken service.
  ansible.builtin.set_fact:
    homarr_lan_address: "{{ homarr_guest_address.stdout | default('') | trim }}"
    homarr_reachable_from_controller: >-
      {{ homarr_bind_host in ['0.0.0.0', '::']
         and (homarr_guest_address.stdout | default('') | trim | length > 0) }}

- name: Assert the board answers on the guest's own address
  # A container that answers on 127.0.0.1 and is published on 0.0.0.0 is a green
  # play with an unreachable service. This is the assertion that catches it.
  ansible.builtin.uri:
    url: "http://{{ homarr_lan_address }}:{{ app_port }}/api/health/live"
    method: GET
    status_code: 200
  register: homarr_lan_health
  until: homarr_lan_health.status | default(0) == 200
  retries: 12
  delay: 5
  changed_when: false
  when: homarr_reachable_from_controller | bool

- name: Assert the board answers from the controller
  # The last hop, and the one that catches a firewall rule Docker bypassed. A
  # ufw rule that denies a published port reads as applied and enforces nothing;
  # this is what proves the port is actually reachable from outside the guest.
  ansible.builtin.uri:
    url: "http://{{ homarr_lan_address }}:{{ app_port }}/api/health/live"
    method: GET
    status_code: 200
  delegate_to: localhost
  become: false
  register: homarr_remote_health
  until: homarr_remote_health.status | default(0) == 200
  retries: 12
  delay: 5
  changed_when: false
  when: homarr_reachable_from_controller | bool

# ---------------------------------------------------------------------------
# The firewall
# ---------------------------------------------------------------------------
#
# A DOCKER-USER rule, not a ufw rule. Docker evaluates its own chains before
# ufw's INPUT, so a ufw rule on a published port is reported as applied and
# enforced by nothing. DOCKER-USER is the chain Docker documents for exactly
# this, and it is evaluated before the DNAT that publishes the port.

- name: Read the current DOCKER-USER rules
  ansible.builtin.command:
    argv: [iptables, -S, DOCKER-USER]
  changed_when: false
  failed_when: false
  register: homarr_docker_user_rules
  when:
    - homarr_manage_firewall | bool
    - homarr_bind_host not in ['127.0.0.1', '::1']

- name: Restrict the published port to the LAN
  # Inserted at the top of DOCKER-USER so it is evaluated before any rule a
  # later container might add. The RETURN at the end is what lets traffic that
  # is not for this port continue to the rest of the chain.
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - DOCKER-USER
      - "1"
      - -p
      - tcp
      - --dport
      - "{{ app_port }}"
      - "!"
      - -s
      - "{{ homarr_lan_cidr }}"
      - -j
      - DROP
  changed_when: true
  when:
    - homarr_manage_firewall | bool
    - homarr_bind_host not in ['127.0.0.1', '::1']
    - homarr_docker_user_rules.stdout is not search('dport ' ~ app_port)

- name: Report the checks that passed
  ansible.builtin.debug:
    msg:
      - "{{ app_name }} is installed and answering on port {{ app_port }}"
      - "docker engine: {{ homarr_docker_version.stdout | default('unknown') | trim }}"
      - "image: {{ homarr_image | regex_replace('^.*@', '') }}"
      - "container: {{ homarr_ps.stdout | default('') | trim }}"
      - "health /api/health/live: HTTP {{ homarr_health.status | default('?') }}"
      - "reachable from controller: {{ homarr_reachable_from_controller | bool }}"
      - "docker socket mounted: {{ homarr_mount_docker_socket | bool }}"
      - "firewall: {{ 'DOCKER-USER ' ~ homarr_lan_cidr if homarr_manage_firewall | bool and homarr_bind_host not in ['127.0.0.1', '::1'] else 'not applied' }}"
