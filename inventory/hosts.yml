# Inventory for the guests this repository provisions.
#
# Two kinds of host matter:
#   proxmox  the PVE node. Runs `pct` over SSH. Reaches guests directly.
#   lxc      the guests. Reached by SSH on the address Proxmox leases them.
#
# `pct create` has no first-class Ansible module, so the proxmox host is the
# only thing that talks to `pct`. Everything else targets the guest directly.
#
# No guest carries a fixed address. Proxmox's SDN zone hands out a DHCP lease
# and registers the hostname in its resolver; the lxc role reads the address
# back with `pct exec <vmid> hostname -I` and sets `ansible_host` from it. The
# controller cannot resolve guest names itself, so the address has to be
# discovered rather than written down.

all:
  children:
    proxmox:
      hosts:
        pve:
          # Replace with your own Proxmox host. The role runs `pct` here, so
          # this account needs permission to create and start containers.
          ansible_host: pve.example.net
          ansible_user: root

    lxc:
      hosts:
        example-app:
          ansible_user: root
          lxc_vmid: 121
          lxc_hostname: example-app

    # Named `ex` rather than `example-app`: Ansible rejects a hyphen in a group
    # name, and a host may not share one.
    ex:
      hosts:
        example-app:
