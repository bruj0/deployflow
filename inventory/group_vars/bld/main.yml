---
# What this guest runs.
#
# The list names roles under apps/. Each role declares its dependency on
# common/python through its meta/main.yml, so adding an application never
# edits a playbook. The builder role declares no dependency on purpose: it
# installs no service and has no port, and common/python asserts that a port
# exists.
app_roles:
  - builder

# The build guest is bigger than the framework default, and the reason is
# measured rather than guessed.
#
# RAM: this is measured, not guessed.
#
# The webpack build of a Next.js tree caps its heap at 10 GB
# (NODE_OPTIONS=--max-old-space-size=10240), and the process reaches about
# 11.5 GB RSS before the build finishes. A 12 GB guest thrashes on that: the
# build was observed spinning with 96 MB free and 348 MB available, and the
# guest stopped answering SSH entirely — the banner timed out, and even
# `pct exec` did not return.
#
# 24 GB clears the heap with room for the native build workers, the page
# cache and the rest of the tree. The builder role asserts the floor, so a
# guest resized by hand is checked rather than discovered during a build.
lxc_cores: 6
lxc_memory: 24576
lxc_swap: 4096

# Disk: the checkout is 16 GB, of which 7.4 GB is the build cache that never
# travels to the artifact and 4.3 GB is node_modules. The builder role
# asserts at least 40 GB free on the workspace filesystem.
lxc_rootfs_gb: 60
